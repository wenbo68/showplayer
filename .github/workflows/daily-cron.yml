# Scheduled maintenance jobs (replaces the crontab + trigger routes on the old VPS).
# - Full daily sequence at 09:00 UTC.
# - Pending user submissions are processed every 4 hours (offset so they never
#   collide with the daily run).
# - Can be started by hand from the Actions tab ("Run workflow"), where you can
#   pick a job/step and the TMDB list limit.
# - Cancel a run from the Actions tab; the script stops at its next checkpoint.
name: Daily cron

on:
  schedule:
    - cron: '0 9 * * *' # full daily sequence (TMDB's export for "yesterday" is ready by then)
    - cron: '30 1,5,13,17,21 * * *' # process pending user submissions
  workflow_dispatch:
    inputs:
      job:
        description: 'Job or single step to run'
        type: choice
        default: all
        options:
          - all
          - userSubmissions
          - changedMedia
          - popularity
          - ratings
          - tmdbLists
          - submissions
          - denorm
      tmdbListLimit:
        description: 'TMDB list limit (for the "fetch tmdb lists" step)'
        type: string
        default: '50'

concurrency:
  group: daily-cron
  cancel-in-progress: false

jobs:
  cron:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      SKIP_ENV_VALIDATION: '1'
      NODE_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Pick job
        id: pick
        # Manual runs use the chosen input; scheduled runs map the daily schedule
        # to "all" and every other schedule to "userSubmissions".
        run: |
          if [ -n "${{ inputs.job }}" ]; then
            echo "job=${{ inputs.job }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 9 * * *" ]; then
            echo "job=all" >> "$GITHUB_OUTPUT"
          else
            echo "job=userSubmissions" >> "$GITHUB_OUTPUT"
          fi

      - name: Run job
        run: pnpm cron "${{ steps.pick.outputs.job }}" "${{ inputs.tmdbListLimit || '50' }}"
