# Daily maintenance job (replaces the crontab + trigger routes on the old VPS).
# - Full sequence at 09:00 UTC, including pending user submissions.
# - Can be started by hand from the Actions tab ("Run workflow"), where you can
#   pick a job/step and the TMDB list limit.
# - Cancel a run from the Actions tab; the script stops at its next checkpoint.
name: Daily cron

on:
  schedule:
    - cron: '0 9 * * *' # 09:00 UTC daily (TMDB's export for "yesterday" is ready by then)
  workflow_dispatch:
    inputs:
      job:
        description: 'Job or single step to run'
        type: choice
        default: all
        options:
          - all
          - userSubmissions
          - changedMedia
          - popularity
          - ratings
          - tmdbLists
          - submissions
          - denorm
      tmdbListLimit:
        description: 'TMDB list limit (for the "fetch tmdb lists" step)'
        type: string
        default: '50'

concurrency:
  group: daily-cron
  cancel-in-progress: false

jobs:
  cron:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      SKIP_ENV_VALIDATION: '1'
      NODE_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      # pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run job
        run: pnpm cron "${{ inputs.job || 'all' }}" "${{ inputs.tmdbListLimit || '50' }}"
